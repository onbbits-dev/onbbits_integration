name: Server Tests (v15)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout App
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Bench
        run: pip install frappe-bench

      - name: Init Bench
        run: |
          bench init frappe-bench --skip-redis-config-generation
          cd frappe-bench

      - name: Get Frappe v15
        run: |
          cd frappe-bench
          bench get-app frappe --branch version-15

      - name: Link App
        run: |
          cd frappe-bench/apps
          ln -s $GITHUB_WORKSPACE onbbits_integration

      - name: Create Site
        run: |
          cd frappe-bench
          bench new-site test_site \
            --admin-password admin \
            --mariadb-root-password root \
            --db-host 127.0.0.1

      - name: Install App
        run: |
          cd frappe-bench
          bench --site test_site install-app onbbits_integration

      - name: Run Tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests --app onbbits_integration

